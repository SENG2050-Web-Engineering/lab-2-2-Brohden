<!DOCTYPE html>

</head>
<body>
    <h1>Welcome to Tomcat Application</h1>
    <p>This is a simple web application running on Java 21.</p>
    <ul>
        <li><a href="/HelloWorld">HelloWorld Servlet</a></li>

    <form action=GreetingServlet method="GET" onsubmit="return true;">

    </form>
